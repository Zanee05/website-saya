<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Koi Nation Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#f3f5f9;
}

/* LOGIN */

.login-page{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff6b2d,#ff8f5a);
}

.login-box{
  width:380px;
  background:white;
  padding:45px;
  border-radius:28px;
  box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.login-logo{
  text-align:center;
  margin-bottom:25px;
}

.login-logo img{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #ff6b2d;
}

.login-title{
  text-align:center;
  font-size:30px;
  font-weight:700;
  color:#ff5a1f;
  margin-bottom:5px;
}

.role-info{
  text-align:center;
  color:#666;
  font-size:13px;
  margin-bottom:20px;
}

.input-group{
  margin-bottom:18px;
}

.input-group label{
  display:block;
  margin-bottom:8px;
  font-size:14px;
  font-weight:500;
}

.input-group input{
  width:100%;
  height:50px;
  border-radius:14px;
  border:1px solid #ddd;
  padding:0 18px;
  outline:none;
}

.login-btn{
  width:100%;
  height:52px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#ff5a1f,#ff7a3c);
  color:white;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

/* APP */

.app{
  display:none;
}

/* HEADER */

.header{
  width:100%;
  min-height:95px;
  background:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 35px;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
  position:fixed;
  top:0;
  left:0;
  z-index:9999;
}

.logo{
  display:flex;
  align-items:center;
  gap:15px;
}

.logo img{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
}

.logo-text h1{
  font-size:28px;
  color:#ff5a1f;
}

.logo-text p{
  color:#777;
}

.header-right{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.role-badge{
  padding:10px 18px;
  border-radius:12px;
  background:linear-gradient(135deg,#6d28ff,#9b5cff);
  color:white;
  font-size:13px;
  font-weight:700;
}

/* BUTTON */

.add-btn{
  height:45px;
  padding:0 20px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#00b95c,#00d46b);
  color:white;
  font-weight:700;
  cursor:pointer;
}

.small-export-btn{
  height:42px;
  padding:0 16px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#2f80ed,#56ccf2);
  color:white;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}

.logout-btn{
  height:42px;
  padding:0 16px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#ff3b30,#ff6259);
  color:white;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}

/* SELECT */

.small-filter{
  height:42px;
  min-width:180px;
  border:none;
  border-radius:10px;
  background:#f5f6fa;
  padding:0 12px;
  font-size:13px;
  outline:none;
}

/* OWNER FILTER FIXED */

.owner-filter-fixed{
  position:fixed;
  top:110px;
  right:30px;
  z-index:999;
}

.owner-filter-fixed .small-filter{
  width:190px;
  height:42px;
  border:none;
  border-radius:12px;
  background:white;
  box-shadow:0 5px 15px rgba(0,0,0,.08);
}

/* CONTAINER */

.container{
  padding:30px;
  padding-top:170px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:20px;
}

/* BOX */

.box{
  background:white;
  border-radius:24px;
  padding:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.06);
  display:flex;
  gap:14px;
  min-height:350px;
  position:relative;
  overflow:hidden;
}

.box::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:6px;
  background:linear-gradient(90deg,#ff5a1f,#ff8a4d);
}

/* LEFT */

.box-left{
  width:120px;
  flex-shrink:0;
}

.box-left img{
  width:100%;
  height:170px;
  object-fit:cover;
  border-radius:16px;
  background:#eee;
}

.upload-input{
  width:100%;
  margin-top:8px;
  font-size:11px;
}

/* EXTRA */

.fish-extra{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.size-input,
.gender-select{
  width:100%;
  height:36px;
  border-radius:10px;
  border:1px solid #ddd;
  padding:0 10px;
  font-size:12px;
  background:#fafafa;
  outline:none;
}

/* RIGHT */

.box-right{
  flex:1;
  display:flex;
  flex-direction:column;
}

.ikan-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.ikan-label{
  background:#fff3ee;
  color:#ff5a1f;
  padding:6px 10px;
  border-radius:8px;
  font-size:10px;
  font-weight:700;
}

/* INPUT */

.box select,
.rank-dropdown{
  width:100%;
  height:38px;
  margin-bottom:8px;
  border-radius:10px;
  border:1px solid #ddd;
  padding:0 12px;
  background:#fafafa;
  font-size:12px;
  outline:none;
}

/* SAVED DATA */

.saved-data{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:5px;
}

.saved-item,
.saved-info{
  background:#f8f8f8;
  border-radius:12px;
  padding:10px;
  display:flex;
  flex-direction:column;
}

/* FIX UKURAN TANGGAL PEMBELIAN */

.saved-item.tanggal-item{
  min-height:58px;
  justify-content:center;
}

.saved-item span,
.saved-info span{
  font-size:10px;
  color:#888;
  margin-bottom:4px;
  font-weight:600;
}

.saved-item strong,
.saved-info strong{
  font-size:14px;
  color:#222;
}

/* BUTTON */

.button-row{
  display:flex;
  gap:8px;
  margin-top:auto;
}

.submit-btn{
  flex:1;
  height:40px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#00b95c,#00d46b);
  color:white;
  font-weight:700;
  cursor:pointer;
}

.reset-btn{
  background:linear-gradient(135deg,#ff3b30,#ff6259);
}

.delete-btn{
  width:45px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#ff3b30,#ff6259);
  color:white;
  font-size:18px;
  cursor:pointer;
}

/* PAGINATION */

.pagination{
  margin-top:40px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.page-btn{
  width:45px;
  height:45px;
  border:none;
  border-radius:12px;
  background:#222;
  color:white;
  font-weight:700;
  cursor:pointer;
}

.page-btn.active{
  background:#6d28ff;
}

/* RESPONSIVE */

@media(max-width:1400px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){

  .grid{
    grid-template-columns:1fr;
  }

  .box{
    flex-direction:column;
  }

  .box-left{
    width:100%;
  }

  .box-left img{
    height:220px;
  }

  .header{
    flex-direction:column;
    gap:15px;
  }

  .header-right{
    width:100%;
  }

  .small-filter,
  .small-export-btn,
  .logout-btn,
  .add-btn{
    width:100%;
  }

  .owner-filter-fixed{
    top:210px;
    right:15px;
  }

}

</style>
</head>

<body>

<!-- LOGIN -->

<div class="login-page" id="loginPage">

  <div class="login-box">

    <div class="login-logo">
      <img src="images/logo.jpeg">
    </div>

    <div class="login-title">
      KOI NATION
    </div>

    <div class="role-info">
      Login Role GO1 / GO2 / GO3 / GO4 / SS1
    </div>

    <div class="input-group">
      <label>Username</label>
      <input type="text" id="username">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password">
    </div>

    <button class="login-btn" onclick="login()">
      LOGIN
    </button>

  </div>

</div>

<!-- APP -->

<div class="app" id="app">

<header class="header">

  <div class="logo">

    <img src="images/logo.jpeg">

    <div class="logo-text">
      <h1>Koi Nation</h1>
      <p>BATU</p>
    </div>

  </div>

  <div class="header-right">

    <div class="role-badge" id="roleBadge">
      ROLE
    </div>

    <button class="add-btn" onclick="addFishBox()">
      + Tambah Kotak
    </button>

    <select id="exportOwner" class="small-filter">
      <option value="">Export Owner</option>
    </select>

    <button class="small-export-btn" onclick="exportExcel()">
      Export Excel
    </button>

    <button class="logout-btn" onclick="logout()">
      Logout
    </button>

  </div>

</header>

<div class="owner-filter-fixed">

  <select
  id="filterOwner"
  class="small-filter"
  onchange="applyFilter()">

    <option value="">Filter Owner</option>

  </select>

</div>

<div class="container">

  <div class="grid" id="grid"></div>

  <div class="pagination" id="pagination"></div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>

/* LOGIN ROLE */

const USERS = [

  { username:'go1', password:'123', role:'GO1' },
  { username:'go2', password:'123', role:'GO2' },
  { username:'go3', password:'123', role:'GO3' },
  { username:'go4', password:'123', role:'GO4' },
  { username:'ss1', password:'123', role:'SS1' }

];

let CURRENT_ROLE = '';

function login(){

  const user =
  document.getElementById('username').value;

  const pass =
  document.getElementById('password').value;

  const foundUser =
  USERS.find(u =>

    u.username === user &&
    u.password === pass

  );

  if(foundUser){

    CURRENT_ROLE = foundUser.role;

    document.getElementById('loginPage').style.display='none';

    document.getElementById('app').style.display='block';

    document.getElementById('roleBadge').innerHTML =
    CURRENT_ROLE;

    applyRoleFilter();

    updateOwnerFilter();

  }else{

    alert('Username atau Password salah');

  }

}

function logout(){

  const confirmLogout =
  confirm('Yakin ingin logout?');

  if(!confirmLogout) return;

  CURRENT_ROLE = '';

  document.getElementById('loginPage').style.display='flex';

  document.getElementById('app').style.display='none';

  document.getElementById('username').value = '';

  document.getElementById('password').value = '';

}

/* DATA */

let DATA =
JSON.parse(localStorage.getItem('koi_data'))
|| [];

let FILTERED_DATA = [];

const ITEMS_PER_PAGE = 10;

let currentPage = 1;

/* ROLE FILTER */

function applyRoleFilter(){

  FILTERED_DATA =
  DATA.filter(item =>

    item.kode === CURRENT_ROLE

  );

  currentPage = 1;

  render(FILTERED_DATA);

}

/* RENDER */

function render(data = FILTERED_DATA){

  const grid =
  document.getElementById('grid');

  const start =
  (currentPage - 1) * ITEMS_PER_PAGE;

  const end =
  start + ITEMS_PER_PAGE;

  const paginated =
  data.slice(start,end);

  grid.innerHTML =
  paginated.map((d,index)=>`

    <div class="box">

      <div class="box-left">

        <img src="${d.img || 'https://via.placeholder.com/300x200?text=Upload+Foto'}">

        ${
          d.saved
          ?
          `
          <div class="fish-extra">

            <div class="saved-info">
              <span>SIZE</span>
              <strong>${d.size || '-'} cm</strong>
            </div>

            <div class="saved-info">
              <span>GENDER</span>
              <strong>${d.gender || 'Uncheck'}</strong>
            </div>

          </div>
          `
          :
          `
          <input
          type="file"
          accept="image/*"
          class="upload-input"
          onchange="uploadImage(event,${DATA.indexOf(d)})">

          <div class="fish-extra">

            <input
            type="number"
            class="size-input"
            placeholder="Size (cm)"
            value="${d.size || ''}"
            onchange="updateSize(${DATA.indexOf(d)},this.value)">

            <select
            class="gender-select"
            onchange="updateGender(${DATA.indexOf(d)},this.value)">

              <option value="">Uncheck</option>

              <option value="Male"
              ${d.gender === 'Male' ? 'selected' : ''}>
              Male</option>

              <option value="Female"
              ${d.gender === 'Female' ? 'selected' : ''}>
              Female</option>

            </select>

          </div>
          `
        }

      </div>

      <div class="box-right">

        <div class="ikan-row">

          <div class="ikan-label">
            IKAN ${start + index + 1}
          </div>

          <div class="ikan-label">
            ${CURRENT_ROLE}
          </div>

        </div>

        ${
          d.saved
          ?
          `
          <div class="saved-data">

            <div class="saved-item">
              <span>EXPERT</span>
              <strong>${d.expert}</strong>
            </div>

            <div class="saved-item">
              <span>NO URUT</span>
              <strong>${d.rank}</strong>
            </div>

            <div class="saved-item">
              <span>OWNER</span>
              <strong>${d.owner}</strong>
            </div>

            <div class="saved-item tanggal-item">
              <span>TANGGAL PEMBELIAN</span>
              <strong>${d.tanggal || '-'}</strong>
            </div>

          </div>
          `
          :
          `
          <select onchange="updateExpert(${DATA.indexOf(d)},this.value)">

            <option value="">Nama Expert</option>

            <option value="Hendri Sukardi">Hendri Sukardi</option>
            <option value="Harwoko">Harwoko</option>
            <option value="Ali Mubin">Ali Mubin</option>
            <option value="Pitoel">Pitoel</option>
            <option value="Hendy F">Hendy F</option>
            <option value="Ali fauri">Ali fauri</option>
            <option value="agung Wibowo">agung Wibowo</option>
            <option value="toro">toro</option>
            <option value="irvan iji">irvan iji</option>
            <option value="Seblu yoyo">Seblu yoyo</option>

          </select>

          <input
          type="number"
          class="rank-dropdown"
          placeholder="No Urut"
          value="${d.rank || ''}"
          onchange="updateRank(${DATA.indexOf(d)},this.value)">

          <input
          type="text"
          class="rank-dropdown"
          placeholder="Nama Owner"
          value="${d.owner || ''}"
          onchange="updateOwner(${DATA.indexOf(d)},this.value)">

          <input
          type="date"
          class="rank-dropdown"
          value="${d.tanggal || ''}"
          onchange="updateTanggal(${DATA.indexOf(d)},this.value)">
          `
        }

        <div class="button-row">

          ${
            d.saved
            ?
            `
            <button
            class="submit-btn reset-btn"
            onclick="resetBox(${DATA.indexOf(d)})">
            RESET
            </button>
            `
            :
            `
            <button
            class="submit-btn"
            onclick="submitData(${DATA.indexOf(d)})">
            SUBMIT
            </button>
            `
          }

          <button
          class="delete-btn"
          onclick="deleteFishBox(${DATA.indexOf(d)})">
          ✕
          </button>

        </div>

      </div>

    </div>

  `).join('');

  renderPagination(data);

}

/* PAGINATION */

function renderPagination(data){

  const totalPages =
  Math.ceil(data.length / ITEMS_PER_PAGE);

  const pagination =
  document.getElementById('pagination');

  pagination.innerHTML='';

  if(totalPages <= 1) return;

  pagination.innerHTML += `
    <button
    class="page-btn"
    onclick="changePage(${Math.max(1,currentPage - 1)})">
    &lt;
    </button>
  `;

  let startPage =
  Math.max(1,currentPage - 1);

  let endPage =
  Math.min(totalPages,startPage + 2);

  if(endPage - startPage < 2){

    startPage =
    Math.max(1,endPage - 2);

  }

  for(let i=startPage;i<=endPage;i++){

    pagination.innerHTML += `
      <button
      class="page-btn ${i === currentPage ? 'active' : ''}"
      onclick="changePage(${i})">
      ${i}
      </button>
    `;

  }

  pagination.innerHTML += `
    <button
    class="page-btn"
    onclick="changePage(${Math.min(totalPages,currentPage + 1)})">
    &gt;
    </button>
  `;

}

function changePage(page){

  currentPage = page;

  render(FILTERED_DATA);

}

/* FILTER */

function updateOwnerFilter(){

  const filterSelect =
  document.getElementById('filterOwner');

  const exportSelect =
  document.getElementById('exportOwner');

  const owners =
  [...new Set(

    DATA
    .filter(item =>

      item.saved &&
      item.kode === CURRENT_ROLE

    )
    .map(item => item.owner)

  )];

  filterSelect.innerHTML =
  `<option value="">Filter Owner</option>`;

  exportSelect.innerHTML =
  `<option value="">Export Owner</option>`;

  owners.forEach(owner=>{

    filterSelect.innerHTML += `
      <option value="${owner}">
        ${owner}
      </option>
    `;

    exportSelect.innerHTML += `
      <option value="${owner}">
        ${owner}
      </option>
    `;

  });

}

function applyFilter(){

  const owner =
  document.getElementById('filterOwner').value;

  currentPage = 1;

  let roleData =
  DATA.filter(item =>

    item.kode === CURRENT_ROLE

  );

  if(owner === ''){

    FILTERED_DATA = roleData;

  }else{

    FILTERED_DATA =
    roleData.filter(item =>

      item.owner === owner

    );

  }

  render(FILTERED_DATA);

}

/* UPDATE */

function updateExpert(index,val){
  DATA[index].expert = val;
  saveLocal();
}

function updateRank(index,val){
  DATA[index].rank = val;
  saveLocal();
}

function updateOwner(index,val){
  DATA[index].owner = val;
  saveLocal();
}

function updateTanggal(index,val){
  DATA[index].tanggal = val;
  saveLocal();
}

function updateSize(index,val){
  DATA[index].size = val;
  saveLocal();
}

function updateGender(index,val){
  DATA[index].gender = val;
  saveLocal();
}

/* UPLOAD */

function uploadImage(event,index){

  const file =
  event.target.files[0];

  if(!file) return;

  const reader =
  new FileReader();

  reader.onload =
  function(e){

    DATA[index].img =
    e.target.result;

    saveLocal();

    render(FILTERED_DATA);

  }

  reader.readAsDataURL(file);

}

/* SUBMIT */

function submitData(index){

  const item = DATA[index];

  if(
    item.expert === '' ||
    item.rank === '' ||
    item.owner === '' ||
    item.img === ''
  ){

    alert('Lengkapi data');

    return;

  }

  DATA[index].saved = true;

  saveLocal();

  updateOwnerFilter();

  render(FILTERED_DATA);

  alert('Data berhasil disimpan');

}

/* RESET */

function resetBox(index){

  DATA[index].saved = false;

  saveLocal();

  updateOwnerFilter();

  render(FILTERED_DATA);

}

/* ADD */

function addFishBox(){

  DATA.push({

    kode:CURRENT_ROLE,
    expert:'',
    rank:'',
    owner:'',
    tanggal:'',
    size:'',
    gender:'',
    saved:false,
    img:''

  });

  saveLocal();

  applyRoleFilter();

}

/* DELETE */

function deleteFishBox(index){

  const confirmDelete =
  confirm('Hapus kotak ikan ini?');

  if(!confirmDelete) return;

  DATA.splice(index,1);

  saveLocal();

  updateOwnerFilter();

  applyRoleFilter();

}

/* EXPORT */

function exportExcel(){

  const owner =
  document.getElementById('exportOwner').value;

  if(owner === ''){

    alert('Pilih owner');

    return;

  }

  const filteredData =
  DATA.filter(item =>

    item.saved &&
    item.owner === owner &&
    item.kode === CURRENT_ROLE

  );

  if(filteredData.length === 0){

    alert('Data kosong');

    return;

  }

  const excelData =
  filteredData.map((item,index) => ({

    IKAN: `IKAN ${index + 1}`,
    KODE: item.kode,
    SIZE: item.size ? item.size + ' cm' : '',
    GENDER: item.gender || 'Uncheck',
    NAMA_EXPERT: item.expert,
    NO_URUT: item.rank,
    NAMA_OWNER: item.owner,
    TANGGAL_PEMBELIAN: item.tanggal || '-'

  }));

  const worksheet =
  XLSX.utils.json_to_sheet(excelData);

  const workbook =
  XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    workbook,
    worksheet,
    owner
  );

  XLSX.writeFile(
    workbook,
    `DATA_${CURRENT_ROLE}_${owner}.xlsx`
  );

}

/* SAVE */

function saveLocal(){

  localStorage.setItem(
    'koi_data',
    JSON.stringify(DATA)
  );

}

</script>

</body>
</html>
